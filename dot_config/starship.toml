# Compact prompt that works well on narrow mobile screens and locally

palette = "catppuccin_mocha"

# Timeout for commands that starship runs (ms)
command_timeout = 1000


# Prompt format — keep it short for mobile
format = """$directory$git_branch$git_status$character"""

# Right-side prompt — extra info without eating line space
right_format = """$cmd_duration$battery"""

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold pink"

[git_branch]
format = " [$branch]($style)"
style = "bold mauve"
truncation_length = 20

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "bold red"
ahead = "⇡"
behind = "⇣"
diverged = "⇡⇣"
stashed = ""
modified = "*"
staged = ""
untracked = ""
deleted = ""
renamed = ""
conflicted = ""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[cmd_duration]
min_time = 5_000
format = "[$duration]($style) "
style = "bold yellow"

[battery]
[[battery.display]]
threshold = 30
style = "bold red"

[palettes.catppuccin_mocha]
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
yellow = "#f9e2af"
green = "#a6e3a1"
