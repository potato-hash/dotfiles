name: Dotfiles checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  apple-command-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: https://code.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Python
        run: apt-get update && apt-get install -y --no-install-recommends python3
      - name: Run portable Apple command contract tests
        run: bash tests/test_apple_commands.sh
